<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="ui-sans-serif, -apple-system, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <style>
      .big { font-size: 19px; fill: #1f2328; font-weight: 600; }
      .title { font-size: 17px; fill: #1f2328; font-weight: 600; }
      .sub { font-size: 13px; fill: #57606a; }
      .note { font-size: 14px; fill: #57606a; }
      .foot { font-size: 13px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1180" height="470" fill="#ffffff"/>

  <!-- 第 n 段 -->
  <text class="big" x="70" y="92">第 n 段</text>

  <rect x="70" y="110" width="190" height="96" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text class="title" x="165" y="145" text-anchor="middle">读槽 ×K</text>
  <text class="sub" x="165" y="168" text-anchor="middle">上一段写槽的输出</text>
  <text class="sub" x="165" y="188" text-anchor="middle">段内 token 都能看到</text>

  <rect x="300" y="110" width="430" height="96" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text class="title" x="515" y="145" text-anchor="middle">本段 token ×T</text>
  <text class="sub" x="515" y="168" text-anchor="middle">真正做 next-token 预测、产生 loss 的部分</text>
  <text class="sub" x="515" y="188" text-anchor="middle">T = 1024（thin 配置）</text>

  <rect x="770" y="110" width="190" height="96" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text class="title" x="865" y="145" text-anchor="middle">写槽 ×K</text>
  <text class="sub" x="865" y="168" text-anchor="middle">看完整段后写出摘要</text>
  <text class="sub" x="865" y="188" text-anchor="middle">不给 token 出 logits</text>

  <!-- 接力箭头 -->
  <path d="M865 206 V246 H165 V300" fill="none" stroke="#0969da" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text class="note" x="440" y="234" text-anchor="middle">mem_out (B, K, d)：写槽的输出，成为下一段的读槽</text>

  <!-- 第 n+1 段 -->
  <text class="big" x="70" y="292">第 n+1 段</text>

  <rect x="70" y="310" width="190" height="96" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text class="title" x="165" y="345" text-anchor="middle">读槽 ×K</text>
  <text class="sub" x="165" y="368" text-anchor="middle">= 上一段的 mem_out</text>
  <text class="sub" x="165" y="388" text-anchor="middle">（第 0 段用可学习的 mem0）</text>

  <rect x="300" y="310" width="430" height="96" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text class="title" x="515" y="345" text-anchor="middle">本段 token ×T</text>
  <text class="sub" x="515" y="368" text-anchor="middle">训练时两段连续原文串联反传（n_seg=2）</text>
  <text class="sub" x="515" y="388" text-anchor="middle">→ 有效上下文 2 × 1024 = 2048</text>

  <rect x="770" y="310" width="190" height="96" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text class="title" x="865" y="345" text-anchor="middle">写槽 ×K</text>
  <text class="sub" x="865" y="368" text-anchor="middle">生成时自动滚动</text>
  <text class="sub" x="865" y="388" text-anchor="middle">可继续往后接</text>

  <text class="foot" x="70" y="448">整段输入长度 L = T + 2K（thin：1024 + 2×32 = 1088）；K=0 时退化为普通 Transformer。代价是有损压缩：状态向量装不下逐字原文，只保留语义摘要。</text>
</svg>
